<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}EALLIS{% endblock %} — Enhanced Adaptive Low-Light Instance Segmentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-name">EALLIS</span>
        <span class="brand-sub">Low-Light Instance Segmentation</span>
      </a>
      <nav class="nav">
        <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('index') }}">Dashboard</a>
        <a class="nav-link {% if active_page == 'segment' %}active{% endif %}" href="{{ url_for('segment') }}">Segmentation</a>
      </nav>
      <div class="sidebar-footer">FYP 2024/25</div>
    </aside>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="errorToast"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
