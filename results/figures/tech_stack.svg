<svg width="740" height="620" viewBox="0 0 740 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="50%" stop-color="#8b9cf5"/><stop offset="100%" stop-color="#67c3ea"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6ad55"/><stop offset="50%" stop-color="#f6cf55"/><stop offset="100%" stop-color="#f9e08a"/>
    </linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1c5"/><stop offset="50%" stop-color="#63b3ed"/><stop offset="100%" stop-color="#76e4b8"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="20" y="15" width="700" height="545" rx="18"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- outer card -->
  <rect x="20" y="15" width="700" height="545" rx="18" fill="#ffffff" stroke="#d5dbe4" stroke-width="1.5" filter="url(#shadow)"/>

  <g clip-path="url(#cardClip)">
    <!-- ================= PRESENTATION TIER ================= -->
    <rect x="20" y="15" width="700" height="40" fill="url(#band1)"/>
    <text x="370" y="41" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Presentation Tier</text>

    <!-- HTML5 shield -->
    <g transform="translate(145,102)">
      <path d="M-20,-24 L20,-24 L16.5,16 L0,22 L-16.5,16 Z" fill="#e44d26"/>
      <path d="M0,-20 L15.6,-20 L12.9,13.2 L0,17.8 Z" fill="#f16529"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">5</text>
      <text x="0" y="-30" text-anchor="middle" fill="#111" font-size="12" font-weight="800" letter-spacing="1">HTML</text>
    </g>
    <text x="145" y="140" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">HTML5</text>

    <!-- CSS3 shield -->
    <g transform="translate(295,102)">
      <path d="M-20,-24 L20,-24 L16.5,16 L0,22 L-16.5,16 Z" fill="#264de4"/>
      <path d="M0,-20 L15.6,-20 L12.9,13.2 L0,17.8 Z" fill="#2965f1"/>
      <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">3</text>
      <text x="0" y="-30" text-anchor="middle" fill="#111" font-size="12" font-weight="800" letter-spacing="1">CSS</text>
    </g>
    <text x="295" y="140" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">CSS3</text>

    <!-- JavaScript -->
    <g transform="translate(445,102)">
      <rect x="-23" y="-23" width="46" height="46" rx="4" fill="#f7df1e"/>
      <text x="18" y="18" text-anchor="end" fill="#323330" font-size="22" font-weight="800">JS</text>
    </g>
    <text x="445" y="140" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">JavaScript</text>

    <!-- Jinja2 -->
    <g transform="translate(595,102)">
      <rect x="-23" y="-23" width="46" height="46" rx="8" fill="#1c1c1c"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="800" font-family="Consolas, monospace">{{ }}</text>
    </g>
    <text x="595" y="140" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Jinja2</text>

    <!-- ================= LOGIC TIER ================= -->
    <rect x="20" y="160" width="700" height="40" fill="url(#band2)"/>
    <text x="370" y="186" text-anchor="middle" fill="#5b3a00" font-size="16" font-weight="700">Logic Tier</text>

    <!-- Python -->
    <g transform="translate(145,242)">
      <g transform="translate(-24,-24)">
        <path d="M24 2c-8 0-11 3-11 7.5V15h11.5v2H8.5C4 17 1.5 20.8 1.5 26.5S4 36 8.5 36H14v-7.5c0-4.2 3.3-7.5 7.5-7.5h9c3.7 0 6.5-2.8 6.5-6.5v-5C37 4.6 32 2 24 2zm-4.8 5a2.1 2.1 0 110 4.2 2.1 2.1 0 010-4.2z" fill="#366994"/>
        <path d="M24 46c8 0 11-3 11-7.5V33H23.5v-2h15.9c4.5 0 7-3.8 7-9.5S43.9 12 39.4 12H34v7.5c0 4.2-3.3 7.5-7.5 7.5h-9c-3.7 0-6.5 2.8-6.5 6.5v5C11 43.4 16 46 24 46zm4.8-5a2.1 2.1 0 110-4.2 2.1 2.1 0 010 4.2z" fill="#ffc331"/>
      </g>
    </g>
    <text x="145" y="280" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Python</text>

    <!-- Flask -->
    <g transform="translate(295,242)">
      <path d="M-4,-20 h8 v3.5 h-2.5 v7 l10.5,15.5 c1.5,2.2 0,5 -2.8,5 h-18.4 c-2.8,0 -4.3,-2.8 -2.8,-5 L-1.5,-9.5 v-7 H-4 Z" fill="none" stroke="#1a1a1a" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M-8.5,2 h17 l6,9 c1,1.6 0,3.5 -2,3.5 h-25 c-2,0 -3,-1.9 -2,-3.5 Z" fill="#1a1a1a"/>
    </g>
    <text x="295" y="280" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Flask</text>

    <!-- PyTorch -->
    <g transform="translate(445,242)">
      <circle cx="0" cy="0" r="13" fill="none" stroke="#ee4c2c" stroke-width="6.5" stroke-dasharray="67.7 14" transform="rotate(-59)"/>
      <circle cx="4.5" cy="-17" r="3.4" fill="#ee4c2c"/>
    </g>
    <text x="445" y="280" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">PyTorch</text>

    <!-- MMDetection -->
    <g transform="translate(595,242)">
      <rect x="-23" y="-23" width="46" height="46" rx="9" fill="#1e66d0"/>
      <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="800">MM</text>
    </g>
    <text x="595" y="280" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">MMDetection</text>

    <!-- NumPy cube -->
    <g transform="translate(145,322)">
      <polygon points="0,-20 17,-11 0,-2 -17,-11" fill="#4dabcf"/>
      <polygon points="-17,-11 0,-2 0,20 -17,11" fill="#4d77cf"/>
      <polygon points="17,-11 0,-2 0,20 17,11" fill="#1b3a6b"/>
    </g>
    <text x="145" y="360" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">NumPy</text>

    <!-- OpenCV -->
    <g transform="translate(295,320)">
      <circle cx="0" cy="-11" r="8.5" fill="none" stroke="#ff0000" stroke-width="5.5" stroke-dasharray="41 12.4" transform="rotate(132 0 -11)"/>
      <circle cx="-10.5" cy="7.5" r="8.5" fill="none" stroke="#5aba46" stroke-width="5.5" stroke-dasharray="41 12.4" transform="rotate(-3 -10.5 7.5)"/>
      <circle cx="10.5" cy="7.5" r="8.5" fill="none" stroke="#2196f3" stroke-width="5.5" stroke-dasharray="41 12.4" transform="rotate(-93 10.5 7.5)"/>
    </g>
    <text x="295" y="360" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">OpenCV</text>

    <!-- Pillow -->
    <g transform="translate(445,322)">
      <rect x="-22" y="-17" width="44" height="34" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.2"/>
      <circle cx="-9" cy="-6" r="4" fill="#f59e0b"/>
      <polygon points="-18,13 -5,-2 3,7 9,1 18,13" fill="#10b981"/>
    </g>
    <text x="445" y="360" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Pillow</text>

    <!-- Matplotlib -->
    <g transform="translate(595,322)">
      <circle cx="0" cy="0" r="17" fill="#f4f7fa" stroke="#8ea4b8" stroke-width="1.4"/>
      <path d="M0,0 L15,0 A15,15 0 0,1 5.1,14.1 Z" fill="#1f77b4" opacity="0.9"/>
      <path d="M0,0 L0,11 A11,11 0 0,1 -10.3,3.8 Z" fill="#66a5d1" opacity="0.9"/>
      <path d="M0,0 L-14,0 A14,14 0 0,1 -4.8,-13.2 Z" fill="#11557c" opacity="0.9"/>
      <path d="M0,0 L1.6,-8.9 A9,9 0 0,1 8.9,-1.6 Z" fill="#4a90c4" opacity="0.9"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="11.5" fill="none" stroke="#ffffff" stroke-width="0.8"/>
    </g>
    <text x="595" y="360" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Matplotlib</text>

    <!-- ================= DATA TIER ================= -->
    <rect x="20" y="386" width="700" height="40" fill="url(#band3)"/>
    <text x="370" y="412" text-anchor="middle" fill="#0b3d36" font-size="16" font-weight="700">Data Tier</text>

    <!-- Git -->
    <g transform="translate(145,468)">
      <rect x="-16" y="-16" width="32" height="32" rx="6" fill="#f05133" transform="rotate(45)"/>
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#ffffff" stroke-width="2.6"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="#ffffff" stroke-width="2.6"/>
      <circle cx="-8" cy="8" r="3.2" fill="#ffffff"/>
      <circle cx="8" cy="-8" r="3.2" fill="#ffffff"/>
      <circle cx="8" cy="8" r="3.2" fill="#ffffff"/>
    </g>
    <text x="145" y="506" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Git</text>

    <!-- GitHub octocat -->
    <g transform="translate(295,468) scale(1.9) translate(-12,-12)">
      <path fill="#171515" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    </g>
    <text x="295" y="506" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">GitHub</text>

    <!-- Google Colab -->
    <g transform="translate(445,468)">
      <circle cx="-8" cy="0" r="9" fill="none" stroke="#f9ab00" stroke-width="5.5" stroke-dasharray="45 11.5" transform="rotate(115 -8 0)"/>
      <circle cx="8" cy="0" r="9" fill="none" stroke="#e8710a" stroke-width="5.5" stroke-dasharray="45 11.5" transform="rotate(-65 8 0)"/>
    </g>
    <text x="445" y="506" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">Google Colab</text>

    <!-- COCO / LIS datasets -->
    <g transform="translate(595,468)">
      <path d="M-17,-13 v26 c0,3.6 7.6,6.5 17,6.5 s17,-2.9 17,-6.5 v-26" fill="#64748b"/>
      <ellipse cx="0" cy="-13" rx="17" ry="6.2" fill="#94a3b8"/>
      <path d="M-17,-3.5 c0,3.6 7.6,6.5 17,6.5 s17,-2.9 17,-6.5" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
      <path d="M-17,6 c0,3.6 7.6,6.5 17,6.5 s17,-2.9 17,-6.5" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
    </g>
    <text x="595" y="506" text-anchor="middle" fill="#334155" font-size="13" font-weight="600">COCO / LIS Datasets</text>
  </g>

  <text x="370" y="595" text-anchor="middle" fill="#6b7280" font-size="12" font-style="italic">Figure: Technology stack of the EALLIS system (self-composed).</text>
</svg>
